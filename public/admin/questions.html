<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Question Bank — ExamHub Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="top-bar"><div class="top-bar-brand"><div class="top-bar-logo">🎓</div> ExamHub Admin</div><div class="top-bar-right"><button class="btn btn-secondary btn-sm" onclick="logout()" style="color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)">Sign Out</button></div></div>
    <nav class="navbar" id="navbar"></nav>
    <div class="page-header">
      <div class="page-header-inner">
        <div><h1>Question Bank</h1><p>Manage MCQ, Subjective and Numeric questions</p></div>
        <div style="display:flex;gap:10px;">
          <input type="file" id="pdf-upload" accept=".pdf" style="display:none" onchange="handlePDFUpload(event)">
          <button class="btn btn-outline" onclick="document.getElementById('pdf-upload').click()">📥 Import from PDF</button>
          <button class="btn btn-primary" id="btn-add-q" onclick="openAddModal()">+ Add Question</button>
        </div>
      </div>
    </div>
    <div class="page-body">
      <div class="container">
        <!-- Filters -->
        <div class="card" style="margin-bottom:16px;padding:14px 16px">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <select class="form-control" id="filter-exam" style="width:240px" onchange="filterChanged()">
              <option value="">All Exams</option>
            </select>
            <select class="form-control" id="filter-section" style="width:200px" onchange="filterChanged()">
              <option value="">All Sections</option>
            </select>
            <select class="form-control" id="filter-type" style="width:160px" onchange="filterChanged()">
              <option value="">All Types</option>
              <option value="mcq">MCQ (Single)</option>
              <option value="msq">MSQ (Multiple)</option>
              <option value="subjective">Subjective</option>
              <option value="numeric">Numeric</option>
            </select>
            <span class="badge badge-blue" id="q-count">Loading...</span>
          </div>
        </div>
        <div id="questions-list"></div>
      </div>
    </div>
  </div>

  <!-- Question Modal -->
  <div class="modal-overlay" id="modal-q">
    <div class="modal" style="max-width:660px">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-q-title">Add Question</h3>
        <button class="modal-close" onclick="closeModal('modal-q')">✕</button>
      </div>
      <form id="q-form">
        <input type="hidden" id="qf-id">
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label required">Exam</label>
            <select class="form-control" id="qf-exam" required onchange="examSelectedForQ()">
              <option value="">Select exam...</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Section</label>
            <select class="form-control" id="qf-section">
              <option value="">No section</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label required">Question Type</label>
            <select class="form-control" id="qf-type" required onchange="typeChanged()">
              <option value="mcq">MCQ — Single Correct</option>
              <option value="msq">MSQ — Multiple Correct</option>
              <option value="subjective">Subjective / Descriptive</option>
              <option value="numeric">Numeric Entry</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Difficulty</label>
            <select class="form-control" id="qf-diff">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
          <div class="form-group col-span-2">
            <label class="form-label required">Question Text</label>
            <textarea class="form-control" id="qf-text" rows="4" required placeholder="Enter the question..."></textarea>
          </div>
        </div>

        <!-- MCQ/MSQ Options -->
        <div id="options-section">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <label class="form-label" style="margin:0">Answer Options</label>
            <button type="button" class="btn btn-secondary btn-sm" onclick="addOptionRow()">+ Add Option</button>
          </div>
          <div id="options-rows" style="display:flex;flex-direction:column;gap:8px"></div>
          <div class="form-hint">✓ Check the checkbox next to correct answer(s)</div>
        </div>

        <!-- Numeric -->
        <div id="numeric-section" style="display:none">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label">Correct Value</label>
              <input class="form-control" type="number" id="qf-num-val" step="any" placeholder="e.g. 42 or 3.14">
            </div>
            <div class="form-group">
              <label class="form-label">Tolerance (±)</label>
              <input class="form-control" type="number" id="qf-num-tol" step="any" value="0" placeholder="Acceptable range">
            </div>
          </div>
        </div>

        <!-- Explanation -->
        <div class="form-group" style="margin-top:8px">
          <label class="form-label">Explanation (shown after exam)</label>
          <textarea class="form-control" id="qf-expl" rows="2" placeholder="Explain the correct answer..."></textarea>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label required">Marks</label>
            <input class="form-control" type="number" id="qf-marks" step="0.5" value="1" required>
          </div>
          <div class="form-group">
            <label class="form-label">Negative Marks (per wrong)</label>
            <input class="form-control" type="number" id="qf-neg" step="0.25" value="0" min="0">
          </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-q')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-q">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Import Preview Modal -->
  <div class="modal-overlay" id="modal-import-preview">
    <div class="modal" style="max-width:900px;max-height:92vh;display:flex;flex-direction:column">
      <div class="modal-header" style="flex-shrink:0">
        <div>
          <h3 class="modal-title">📄 Preview Imported Questions</h3>
          <p class="card-subtitle" id="import-stats">Review questions before saving</p>
        </div>
        <button class="modal-close" onclick="closeModal('modal-import-preview')">✕</button>
      </div>
      
      <div id="import-preview-list" style="overflow-y:auto;flex:1;padding:16px 0;display:flex;flex-direction:column;gap:12px">
        <!-- Preview items will be injected here -->
      </div>
      
      <div style="display:flex;justify-content:flex-end;gap:10px;padding-top:14px;border-top:1px solid var(--border);margin-top:10px;flex-shrink:0">
        <button class="btn btn-secondary" onclick="closeModal('modal-import-preview')">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-import" onclick="confirmBulkImport()">Confirm Import</button>
      </div>
    </div>
  </div>

  <script src="/js/pdf-parser.js?v=2"></script>
  <script src="/js/app.js"></script>
  <script>
    requireAuth('admin');
    buildNavbar('Questions');

    let allExams = [], allSections = [], allQuestions = [];

    async function loadData() {
      try {
        showLoading();
        [allExams, allQuestions] = await Promise.all([apiFetch('/exams'), apiFetch('/questions')]);
        hideLoading();
        // Load all sections
        allSections = [];
        for (const e of allExams) {
          const secs = await apiFetch(`/exams/${e.id}/sections`);
          allSections.push(...secs.map(s => ({ ...s, examTitle: e.title })));
        }
        populateFilters();
        renderQuestions();
      } catch (err) { hideLoading(); showToast('Load error: ' + err.message, 'error'); }
    }

    function populateFilters() {
      const fe = document.getElementById('filter-exam');
      const qfe = document.getElementById('qf-exam');
      const opts = allExams.map(e => `<option value="${e.id}">${esc(e.title)}</option>`).join('');
      fe.innerHTML = '<option value="">All Exams</option>' + opts;
      qfe.innerHTML = '<option value="">Select exam...</option>' + opts;

      const params = new URLSearchParams(location.search);
      const pre = params.get('examId');
      if (pre) { fe.value = pre; filterChanged(); }
    }

    function filterChanged() {
      const examId    = document.getElementById('filter-exam').value;
      const sectionId = document.getElementById('filter-section').value;
      const type      = document.getElementById('filter-type').value;

      // Update section dropdown
      const secs = examId ? allSections.filter(s => s.exam_id === examId) : allSections;
      document.getElementById('filter-section').innerHTML =
        '<option value="">All Sections</option>' + secs.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');

      renderQuestions(examId, sectionId, type);
    }

    function renderQuestions(examId, sectionId, type) {
      examId    = examId    ?? document.getElementById('filter-exam').value;
      sectionId = sectionId ?? document.getElementById('filter-section').value;
      type      = type      ?? document.getElementById('filter-type').value;

      let qs = allQuestions;
      if (examId)    qs = qs.filter(q => q.exam_id === examId);
      if (sectionId) qs = qs.filter(q => q.section_id === sectionId);
      if (type)      qs = qs.filter(q => q.type === type);

      document.getElementById('q-count').textContent = `${qs.length} question${qs.length !== 1 ? 's' : ''}`;

      const el = document.getElementById('questions-list');
      if (!qs.length) {
        el.innerHTML = `<div class="card"><div class="empty-state"><div class="empty-icon">❓</div><h3>No questions found</h3><p>Add questions using the button above.</p></div></div>`;
        return;
      }

      // Group by exam
      const byExam = {};
      qs.forEach(q => {
        const exam = allExams.find(e => e.id === q.exam_id);
        if (!byExam[q.exam_id]) byExam[q.exam_id] = { title: exam?.title || 'Unknown', qs: [] };
        byExam[q.exam_id].qs.push(q);
      });

      el.innerHTML = Object.values(byExam).map(group => `
        <div style="margin-bottom:20px">
          <div style="font-weight:700;font-size:.9rem;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
            ${esc(group.title)} <span class="badge badge-blue">${group.qs.length} Q</span>
          </div>
          ${group.qs.map((q, i) => {
            const section = allSections.find(s => s.id === q.section_id);
            const typeLabels = { mcq: 'MCQ', msq: 'MSQ', subjective: 'Descriptive', numeric: 'Numeric' };
            const diffColor = { easy: 'badge-success', medium: 'badge-warning', hard: 'badge-danger' }[q.difficulty] || 'badge-grey';
            return `<div class="card animate-in" style="margin-bottom:10px;animation-delay:${i*.03}s">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
                <div style="flex:1;min-width:0">
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">
                    <span class="badge badge-blue">${typeLabels[q.type]||q.type}</span>
                    <span class="badge ${diffColor}">${q.difficulty}</span>
                    ${section ? `<span class="badge badge-grey">📂 ${esc(section.name)}</span>` : ''}
                    <span class="badge badge-grey">+${q.marks} marks</span>
                    ${q.negative_marks > 0 ? `<span class="badge badge-danger">-${q.negative_marks} wrong</span>` : ''}
                  </div>
                  <p style="font-size:.875rem;color:var(--text-primary);font-weight:500;margin-bottom:10px;line-height:1.5">${esc(q.content)}</p>
                  ${q.type === 'mcq' || q.type === 'msq' ? `
                    <div style="display:flex;flex-direction:column;gap:3px">
                      ${(q.options||[]).map((opt, oi) => `
                        <div style="display:flex;align-items:center;gap:6px;font-size:.8rem;color:${opt.is_correct ? 'var(--success)' : 'var(--text-muted)'}">
                          <span>${opt.is_correct ? '✓' : '○'}</span>
                          <span style="${opt.is_correct ? 'font-weight:600' : ''}">${esc(opt.content)}</span>
                        </div>`).join('')}
                    </div>` : ''}
                  ${q.type === 'numeric' ? `<span style="font-size:.8rem;color:var(--text-muted)">Answer: ${q.numeric_answers?.[0]?.correct_value ?? '?'} ± ${q.numeric_answers?.[0]?.tolerance ?? 0}</span>` : ''}
                  ${q.type === 'subjective' ? `<span style="font-size:.8rem;color:var(--text-muted)">Open-ended — graded by admin</span>` : ''}
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0">
                  <button class="btn btn-secondary btn-sm" onclick="editQuestion('${q.id}')">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')">Delete</button>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`).join('');
    }

    // ── Add/Edit Modal ─────────────────────────────────────────────
    let optCount = 0;
    function addOptionRow(text = '', correct = false) {
      optCount++;
      const id = 'opt_' + optCount;
      const div = document.createElement('div');
      div.style.cssText = 'display:flex;align-items:center;gap:8px';
      div.innerHTML = `
        <input type="checkbox" id="chk_${id}" ${correct ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer;accent-color:var(--navy-600)" title="Mark as correct">
        <input class="form-control" type="text" id="txt_${id}" value="${esc(text)}" placeholder="Option text..." style="flex:1" required>
        <button type="button" class="btn btn-danger btn-sm btn-icon" onclick="this.parentElement.remove()" title="Remove">✕</button>`;
      document.getElementById('options-rows').appendChild(div);
    }

    function typeChanged() {
      const type = document.getElementById('qf-type').value;
      document.getElementById('options-section').style.display  = (type === 'mcq' || type === 'msq') ? 'block' : 'none';
      document.getElementById('numeric-section').style.display  = type === 'numeric' ? 'block' : 'none';
    }

    async function examSelectedForQ() {
      const examId = document.getElementById('qf-exam').value;
      const secs = examId ? allSections.filter(s => s.exam_id === examId) : [];
      document.getElementById('qf-section').innerHTML = '<option value="">No section</option>' +
        secs.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    }

    function openAddModal() {
      document.getElementById('qf-id').value = '';
      document.getElementById('q-form').reset();
      document.getElementById('options-rows').innerHTML = '';
      optCount = 0;
      document.getElementById('qf-marks').value = 1;
      document.getElementById('qf-neg').value = 0;
      typeChanged();
      // Pre-fill exam filter
      const pre = document.getElementById('filter-exam').value;
      if (pre) { document.getElementById('qf-exam').value = pre; examSelectedForQ(); }
      // Default 4 options
      ['','','',''].forEach(() => addOptionRow());
      document.getElementById('modal-q-title').textContent = 'Add Question';
      openModal('modal-q');
    }

    function editQuestion(id) {
      const q = allQuestions.find(x => x.id === id);
      if (!q) return;
      document.getElementById('qf-id').value = q.id;
      document.getElementById('qf-exam').value = q.exam_id;
      examSelectedForQ().then(() => { document.getElementById('qf-section').value = q.section_id || ''; });
      document.getElementById('qf-type').value = q.type;
      document.getElementById('qf-text').value = q.content;
      document.getElementById('qf-expl').value = q.explanation || '';
      document.getElementById('qf-marks').value = q.marks;
      document.getElementById('qf-neg').value = q.negative_marks || 0;
      document.getElementById('qf-diff').value = q.difficulty || 'medium';
      document.getElementById('options-rows').innerHTML = '';
      optCount = 0;
      typeChanged();
      if (q.type === 'mcq' || q.type === 'msq') {
        (q.options || []).forEach(o => addOptionRow(o.content, o.is_correct));
      }
      if (q.type === 'numeric' && q.numeric_answers?.[0]) {
        document.getElementById('qf-num-val').value = q.numeric_answers[0].correct_value;
        document.getElementById('qf-num-tol').value = q.numeric_answers[0].tolerance;
      }
      document.getElementById('modal-q-title').textContent = 'Edit Question';
      openModal('modal-q');
    }

    document.getElementById('q-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const id   = document.getElementById('qf-id').value;
      const type = document.getElementById('qf-type').value;
      const btn  = document.getElementById('btn-save-q');

      let options = [], numeric_answer = null;
      if (type === 'mcq' || type === 'msq') {
        const rows = document.getElementById('options-rows').children;
        for (const row of rows) {
          const txt = row.querySelector('input[type="text"]')?.value.trim();
          const chk = row.querySelector('input[type="checkbox"]')?.checked;
          if (txt) options.push({ content: txt, is_correct: !!chk });
        }
        if (!options.length) { showToast('Add at least 1 option', 'error'); return; }
        if (!options.some(o => o.is_correct)) { showToast('Mark at least 1 correct answer', 'error'); return; }
      }
      if (type === 'numeric') {
        numeric_answer = { correct_value: parseFloat(document.getElementById('qf-num-val').value), tolerance: parseFloat(document.getElementById('qf-num-tol').value) || 0 };
      }

      const payload = {
        exam_id: document.getElementById('qf-exam').value,
        section_id: document.getElementById('qf-section').value || null,
        type,
        content: document.getElementById('qf-text').value.trim(),
        explanation: document.getElementById('qf-expl').value.trim() || null,
        marks: parseFloat(document.getElementById('qf-marks').value),
        negative_marks: parseFloat(document.getElementById('qf-neg').value) || 0,
        difficulty: document.getElementById('qf-diff').value,
        options,
        numeric_answer
      };

      btn.disabled = true; btn.textContent = 'Saving...';
      try {
        if (id) await apiFetch(`/questions/${id}`, { method: 'PUT', body: payload });
        else await apiFetch('/questions', { method: 'POST', body: payload });
        showToast(id ? 'Question updated!' : 'Question added!', 'success');
        closeModal('modal-q');
        allQuestions = await apiFetch('/questions');
        renderQuestions();
      } catch (err) { showToast('Error: ' + err.message, 'error'); }
      btn.disabled = false; btn.textContent = 'Save Question';
    });

    async function deleteQuestion(id) {
      const ok = await confirmDialog('Delete this question?', 'Delete', true);
      if (!ok) return;
      try { await apiFetch(`/questions/${id}`, { method: 'DELETE' }); showToast('Deleted', 'success'); allQuestions = allQuestions.filter(q => q.id !== id); renderQuestions(); }
      catch (err) { showToast('Error: ' + err.message, 'error'); }
    }

    // --- PDF Import Logic ---
    let importedQuestions = [];

    async function handlePDFUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const examId = document.getElementById('filter-exam').value;
      if (!examId) {
        document.getElementById('pdf-upload').value = '';
        return showToast('Please select an Exam from the filter first to import questions.', 'error');
      }

      showLoading('Parsing PDF (this may take a moment)...');
      try {
        const formData = new FormData();
        formData.append('pdf', file);

        const res = await fetch(API_BASE + '/questions/parse-pdf', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + getToken() },
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Parsing failed');
        
        importedQuestions = data;
        hideLoading();
        
        if (importedQuestions.length === 0) {
          showToast('No questions could be extracted.', 'error');
          return;
        }

        renderImportPreview();
        openModal('modal-import-preview');

      } catch (err) {
        hideLoading();
        showToast('Error parsing PDF: ' + err.message, 'error');
      } finally {
        document.getElementById('pdf-upload').value = '';
      }
    }

    function renderImportPreview() {
      const container = document.getElementById('import-preview-list');
      document.getElementById('import-stats').textContent = `Detected ${importedQuestions.length} questions`;
      
      container.innerHTML = importedQuestions.map((q, i) => `
        <div style="border:1px solid var(--border);border-radius:6px;padding:12px;position:relative" id="imp-q-${i}">
          <button class="btn btn-sm btn-secondary" style="position:absolute;top:12px;right:12px;color:#dc2626;border:none;background:transparent" onclick="removeImportQuestion(${i})">✕</button>
          
          <div style="font-weight:700;font-size:.8rem;color:var(--text-muted);margin-bottom:6px;display:flex;gap:10px">
            <span class="badge badge-grey">${q.type.toUpperCase()}</span>
            <span>Marks: ${q.marks}</span>
            <span>Diff: ${q.difficulty}</span>
          </div>
          
          <div style="font-size:.9rem;font-weight:600;margin-bottom:8px">${esc(q.content)}</div>
          
          ${q.options.map((o, oi) => `
            <div style="font-size:.85rem;padding:4px 8px;border-radius:4px;margin-bottom:4px;${o.is_correct ? 'background:#dcfce7;color:#166534;font-weight:600' : 'background:var(--bg-page);color:var(--text-secondary)'}">
              ${String.fromCharCode(65+oi)}) ${esc(o.content)}
            </div>
          `).join('')}

          ${q._warnings && q._warnings.length > 0 ? `
            <div style="margin-top:8px;padding:6px 10px;background:#fef3c7;border-left:3px solid #d97706;font-size:.8rem;color:#92400e">
              ⚠️ ${q._warnings.join('<br>')}
              <br><small>Raw Answer Extracted: ${esc(q._rawAnswer || 'None')}</small>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function removeImportQuestion(index) {
      importedQuestions.splice(index, 1);
      renderImportPreview();
    }

    async function confirmBulkImport() {
      if (importedQuestions.length === 0) return;
      const examId = document.getElementById('filter-exam').value;
      const sectionId = document.getElementById('filter-section').value || null;
      
      const payload = importedQuestions.map(q => ({
        exam_id: examId,
        section_id: sectionId,
        type: q.type,
        content: q.content,
        marks: q.marks,
        difficulty: q.difficulty,
        options: q.options
      }));

      const btn = document.getElementById('btn-confirm-import');
      btn.disabled = true; btn.textContent = 'Importing...';
      
      try {
        await apiFetch('/questions/bulk', { method: 'POST', body: { questions: payload } });
        showToast(`Successfully imported ${payload.length} questions!`, 'success');
        closeModal('modal-import-preview');
        importedQuestions = [];
        allQuestions = await apiFetch('/questions');
        renderQuestions();
      } catch (err) {
        showToast('Import Error: ' + err.message, 'error');
      }
      btn.disabled = false; btn.textContent = 'Confirm Import';
    }

    loadData();
  </script>
</body>
</html>
