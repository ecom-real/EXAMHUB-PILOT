<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Payments — ExamHub Admin</title>
  <meta name="description" content="View and manage all Razorpay payment records for ExamHub">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .revenue-card {
      background: linear-gradient(135deg, #1e4d9a 0%, #2563eb 100%);
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(37,99,235,.3);
    }
    .revenue-icon { font-size: 2.2rem; }
    .revenue-amount { font-size: 2rem; font-weight: 800; line-height: 1; }
    .revenue-label { font-size: .82rem; opacity: .8; margin-top: 4px; }
    .status-paid    { background: #dcfce7; color: #166534; border-radius: 6px; padding: 3px 10px; font-size: .78rem; font-weight: 700; }
    .status-created { background: #fef9c3; color: #854d0e; border-radius: 6px; padding: 3px 10px; font-size: .78rem; font-weight: 700; }
    .status-failed  { background: #fee2e2; color: #991b1b; border-radius: 6px; padding: 3px 10px; font-size: .78rem; font-weight: 700; }
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .filter-bar input, .filter-bar select { flex: 1; min-width: 160px; max-width: 280px; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="top-bar">
      <div class="top-bar-brand"><div class="top-bar-logo">🎓</div> ExamHub Admin</div>
      <div class="top-bar-right">
        <button class="btn btn-secondary btn-sm" onclick="logout()" style="color:rgba(255,255,255,.7);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)">Sign Out</button>
      </div>
    </div>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-header">
      <div class="page-header-inner">
        <div>
          <div class="breadcrumb"><span>Admin</span> / <span>Payments</span></div>
          <h1>Payment Records</h1>
          <p>All Razorpay transactions on the platform</p>
        </div>
        <button class="btn btn-secondary" onclick="exportCSV()">⬇ Export CSV</button>
      </div>
    </div>

    <div class="page-body">
      <div class="container">

        <!-- Stats Row -->
        <div class="grid grid-4" style="margin-bottom:24px">
          <div class="revenue-card animate-in">
            <div class="revenue-icon">💰</div>
            <div>
              <div class="revenue-amount" id="stat-revenue">₹0</div>
              <div class="revenue-label">Total Revenue</div>
            </div>
          </div>
          <div class="stat-card green animate-in" style="animation-delay:.06s">
            <div class="stat-icon green">✅</div>
            <div><div class="stat-value" id="stat-paid">—</div><div class="stat-label">Paid</div></div>
          </div>
          <div class="stat-card orange animate-in" style="animation-delay:.12s">
            <div class="stat-icon orange">⏳</div>
            <div><div class="stat-value" id="stat-pending">—</div><div class="stat-label">Pending</div></div>
          </div>
          <div class="stat-card blue animate-in" style="animation-delay:.18s">
            <div class="stat-icon blue">❌</div>
            <div><div class="stat-value" id="stat-failed">—</div><div class="stat-label">Failed</div></div>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
          <input class="form-control" type="text" id="search-input" placeholder="🔍 Search student / exam..." oninput="renderTable()">
          <select class="form-control" id="status-filter" onchange="renderTable()">
            <option value="">All Statuses</option>
            <option value="paid">Paid</option>
            <option value="created">Pending</option>
            <option value="failed">Failed</option>
          </select>
        </div>

        <!-- Table -->
        <div id="payments-table"></div>

      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth('admin');
    buildNavbar('Payments');

    let allPayments = [];

    async function loadPayments() {
      try {
        allPayments = await apiFetch('/admin/payments');

        // Stats
        const paid    = allPayments.filter(p => p.status === 'paid');
        const pending = allPayments.filter(p => p.status === 'created');
        const failed  = allPayments.filter(p => p.status === 'failed');
        const revenue = paid.reduce((sum, p) => sum + parseFloat(p.amount || 0), 0);

        document.getElementById('stat-revenue').textContent = '₹' + revenue.toLocaleString('en-IN', { maximumFractionDigits: 0 });
        document.getElementById('stat-paid').textContent    = paid.length;
        document.getElementById('stat-pending').textContent = pending.length;
        document.getElementById('stat-failed').textContent  = failed.length;

        renderTable();
      } catch (err) {
        showToast('Failed to load payments: ' + err.message, 'error');
      }
    }

    function renderTable() {
      const q      = document.getElementById('search-input').value.toLowerCase();
      const status = document.getElementById('status-filter').value;

      const filtered = allPayments.filter(p => {
        const matchQ = !q ||
          (p.users?.name || '').toLowerCase().includes(q) ||
          (p.users?.email || '').toLowerCase().includes(q) ||
          (p.users?.roll_number || '').toLowerCase().includes(q) ||
          (p.exams?.title || '').toLowerCase().includes(q);
        const matchS = !status || p.status === status;
        return matchQ && matchS;
      });

      const el = document.getElementById('payments-table');
      if (!filtered.length) {
        el.innerHTML = `<div class="card"><div class="empty-state"><div class="empty-icon">💳</div><h3>No payment records found</h3><p>Payments will appear here once students complete Razorpay checkout.</p></div></div>`;
        return;
      }

      el.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr>
          <th>#</th>
          <th>Student</th>
          <th>Roll No.</th>
          <th>Exam</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Razorpay Order ID</th>
          <th>Razorpay Payment ID</th>
          <th>Date</th>
        </tr></thead>
        <tbody>
          ${filtered.map((p, i) => `<tr>
            <td style="color:var(--text-muted);font-size:.8rem">${i + 1}</td>
            <td>
              <div style="font-weight:700">${esc(p.users?.name || '—')}</div>
              <div style="font-size:.75rem;color:var(--text-muted)">${esc(p.users?.email || '')}</div>
            </td>
            <td style="font-size:.85rem">${esc(p.users?.roll_number || '—')}</td>
            <td>
              <div style="font-weight:600">${esc(p.exams?.title || '—')}</div>
              ${p.exams?.exam_code ? `<span class="badge badge-grey" style="font-size:.7rem">${esc(p.exams.exam_code)}</span>` : ''}
            </td>
            <td style="font-weight:700;color:var(--text-primary)">₹${parseFloat(p.amount || 0).toFixed(2)}</td>
            <td><span class="status-${p.status}">${p.status === 'paid' ? '✅ Paid' : p.status === 'created' ? '⏳ Pending' : '❌ Failed'}</span></td>
            <td style="font-size:.72rem;color:var(--text-muted);font-family:monospace">${esc(p.razorpay_order_id || '—')}</td>
            <td style="font-size:.72rem;color:var(--text-muted);font-family:monospace">${esc(p.razorpay_payment_id || '—')}</td>
            <td style="font-size:.8rem;color:var(--text-muted);white-space:nowrap">${formatDateTime(p.created_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table></div>`;
    }

    function exportCSV() {
      if (!allPayments.length) { showToast('No data to export', 'warning'); return; }
      let csv = 'Student,Email,Roll No,Exam,Amount (INR),Status,Order ID,Payment ID,Date\n';
      allPayments.forEach(p => {
        csv += `"${p.users?.name||''}","${p.users?.email||''}","${p.users?.roll_number||''}","${p.exams?.title||''}",${parseFloat(p.amount||0).toFixed(2)},${p.status},"${p.razorpay_order_id||''}","${p.razorpay_payment_id||''}","${p.created_at||''}"\n`;
      });
      downloadCSV(csv, 'examhub_payments.csv');
    }

    loadPayments();
  </script>
</body>
</html>
